<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadFlow CRM | Client Lead Management System</title>
    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>
<body>

    <div class="lead-details">

        <div class="details-card">

            <div class="details-header">

                <h1 id="leadName">Loading...</h1>

                <span class="status" id="leadStatusBadge"></span>

            </div>

            <div class="details-grid">

                <div>
                    <h4>Company</h4>
                    <p id="leadCompany">-</p>
                </div>

                <div>
                    <h4>Email</h4>
                    <p id="leadEmail">-</p>
                </div>

                <div>
                    <h4>Phone</h4>
                    <p id="leadPhone">-</p>
                </div>

                <div>
                    <h4>Lead Source</h4>
                    <p id="leadSource">-</p>
                </div>


                <div>
                    <h4>Date Added</h4>
                    <p id="leadDate">-</p>
                </div>

                <div>
                    <h4>Assigned To</h4>
                    <p>Admin</p>
                </div>


            </div>

            <div class="notes">

                <h3>Notes</h3>

                <p id="leadNotes">-</p>

            </div>

            <div class="details-buttons">

                <button id="editBtn" class="edit-btn">
                    <i class="fa-solid fa-pen"></i>
                    Edit
                </button>

                <button id="deleteBtn" class="delete-btn">
                    <i class="fa-solid fa-trash"></i>
                    Delete
                </button>

                <a href="dashboard.html" class="back-btn">
                    <i class="fa-solid fa-arrow-left"></i>
                    Dashboard
                </a>
                
            </div>

        </div>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="lead-details.js"></script>
</body>
</html>
