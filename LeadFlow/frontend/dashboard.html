<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadFlow CRM | Client Lead Management System</title>
    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="dashboard">

        <!---------------Sidebar----------------->
        <aside class="sidebar">
            <h2>LeadFlow</h2>

            <ul>

                <li class="active"><a href="dashboard.html"><i class="fa-solid fa-table-columns"></i>Dashboard</a></li>

                <li><a href="leads.html"><i class="fa-solid fa-table-columns"></i>Leads</a></li>

                <li><a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i>Logout</a></li>

            </ul>

        </aside>

        <!-------Main-------->

        <main class="main">

            <!----Top Bar------>

            <header class="topbar">

                <div>
                    <h1>Dashboard</h1>

                    <p>Welcome back, Admin!</p>

                </div>

                <div class="top-icons">

                    <i class="fa-solid fa-bell"></i>

                    <i class="fa-solid fa-circle-user"></i>


                </div>

            </header>

            <!--------Statistics-------->

            <section class="cards">

                <div class="card">
                    <h3>New Leads</h3>
                    <h2 id="newLeads">0</h2>
                </div>

                <div class="card">
                    <h3>Contacted</h3>
                    <h2 id="contactedLeads">0</h2>
                </div>

                <div class="card">
                    <h3>Converted</h3>
                    <h2 id="convertedLeads">0</h2>
                </div>

                <div class="card">
                    <h3>Total Leads</h3>
                    <h2 id="totalLeads">0</h2>
                </div>

            </section>


            <section class="charts">

                <div class="chart-card">
                    <h2>Leads Per Month</h2>
                    <canvas id="monthlyChart"></canvas>
                </div>

                <div class="chart-card">
                    <h2>Lead Status</h2>
                    <canvas id="statusChart"></canvas>
                </div>

            </section>

            <section class="charts">

                <div class="chart-card full-width">
                    <h2>Lead Sources</h2>
                    <canvas id="sourceChart"></canvas>
                </div>

            </section>

            <!-----Recent Leads------>

            <section class="table">

                <h2>Recent Leads</h2>

                <table>

                    <tr>
                        <th>Name</th>
                        <th>Company</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>

                    <tbody id="recentLeadsBody">
                        <tr><td colspan="4">Loading...</td></tr>
                    </tbody>

                </table>
            </section>

        </main>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="config.js"></script>
    <script src="dashboard.js"></script>
    <script src="auth.js"></script>
</body>
</html>
